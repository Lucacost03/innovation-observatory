name: Publish Innovation Observatory
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out hosting repository
        uses: actions/checkout@v4
      - name: Restore and verify the preserved engine 1.30 source
        shell: bash
        run: |
          set -euo pipefail
          test -f source/innovation_observatory_source.zip
          echo '7f27eb8de94e035c53c63732bbe6e34a49b20f8be400265276242ddfcc0f4b68  source/innovation_observatory_source.zip' | sha256sum --check -
          python3 -m zipfile --extract source/innovation_observatory_source.zip restored
          python3 restored/innovation_observatory/scripts/unpack_source_fixtures.py
      - name: Preserve the baseline and apply reviewed source changes
        run: |
          python3 patches/engine-1.30.1/scripts/freeze_engine130.py restored/innovation_observatory
          cp -a patches/engine-1.30.1/. restored/innovation_observatory/
      - name: Verify retirement reporting and unchanged economic paths
        working-directory: restored/innovation_observatory
        run: |
          node tests/retirement-pensions.mjs
          node tests/revision1301.mjs
          node tests/configuration.mjs
          node tests/tariff-fiscal.mjs
          node tests/inference.mjs
          node tests/participation-import-cost.mjs
          node tests/credit-policy.mjs
          node tests/noncash-pension.mjs
          node --check dist/app.mjs
          node --check dist/findings.mjs
          node --check dist/revision126-view.mjs
      - name: Build the current evidence and full reproducible source download
        working-directory: restored/innovation_observatory
        run: |
          node scripts/build_revision1301_summary.mjs
          node scripts/build_audit.mjs
          python3 scripts/bundle_source_fixtures.py
          python3 scripts/package_source.py
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/data/profiles.json
          test -s dist/data/revision1301_validation.json
          test -s dist/data/innovation_observatory_source.zip
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: restored/innovation_observatory/dist
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v5
