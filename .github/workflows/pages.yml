name: Publish Innovation Observatory
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out hosting repository
        uses: actions/checkout@v4
      - name: Retrieve and verify the published engine 1.30 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          if [ ! -f source/innovation_observatory_source.zip ]; then
            curl --fail --location --retry 3 --retry-delay 3 \
              'https://agent-based-model-lucacostoli.luccc3.chatgpt.site/data/innovation_observatory_source.zip' \
              --output source/innovation_observatory_source.zip
          fi
          echo '7f27eb8de94e035c53c63732bbe6e34a49b20f8be400265276242ddfcc0f4b68  source/innovation_observatory_source.zip' | sha256sum --check -
          python3 -m zipfile --extract source/innovation_observatory_source.zip restored
          python3 restored/innovation_observatory/scripts/unpack_source_fixtures.py
      - name: Verify the unchanged model
        working-directory: restored/innovation_observatory
        run: |
          node tests/tariff-fiscal.mjs
          node tests/inference.mjs
          node --check dist/app.mjs
      - name: Prepare the complete static website
        run: |
          cp source/innovation_observatory_source.zip restored/innovation_observatory/dist/data/innovation_observatory_source.zip
          touch restored/innovation_observatory/dist/.nojekyll
          test -s restored/innovation_observatory/dist/index.html
          test -s restored/innovation_observatory/dist/data/profiles.json
          test -s restored/innovation_observatory/dist/data/revision130_validation.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: restored/innovation_observatory/dist
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Preserve the verified source for independent future deployments
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch source/innovation_observatory_source.zip >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add source/innovation_observatory_source.zip
            git commit -m 'Preserve verified engine 1.30 source archive [skip ci]'
            git push origin HEAD:main
          fi
